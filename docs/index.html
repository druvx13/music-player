<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neon Wave — a browser-based music player. Songs are stored locally in your browser — no server required.">
    <title>Neon Wave Music Player</title>

    <!-- Tailwind CSS (Play CDN — swap for a build step in production) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome 6.7.2 -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Application styles (includes Google Fonts import) -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="antialiased">

    <!-- Floating background visualizer -->
    <div class="floating-visualizer" aria-hidden="true">
        <div class="visualizer-circle" style="width:300px;height:300px;top:10%;left:10%;"></div>
        <div class="visualizer-circle" style="width:200px;height:200px;top:60%;left:70%;"></div>
        <div class="visualizer-circle" style="width:400px;height:400px;top:30%;left:50%;"></div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-4xl">

        <!-- ── Player ─────────────────────────────────────────────────── -->
        <div class="glass-effect rounded-2xl p-6 neon-shadow mb-8">
            <div class="flex flex-col md:flex-row gap-6 player-container">

                <!-- Album art -->
                <div class="w-full md:w-1/3 aspect-square rounded-xl overflow-hidden relative flex-shrink-0 album-art">
                    <div id="coverArt" class="w-full h-full flex items-center justify-center default-cover">
                        <i class="fas fa-music text-5xl" aria-hidden="true"></i>
                    </div>
                    <div id="waveform" class="waveform absolute bottom-0 left-0 right-0
                         bg-gradient-to-t from-black/70 to-transparent hidden"
                         aria-hidden="true">
                        <!-- Waveform bars generated by JS -->
                    </div>
                    <button id="lyricsBtn"
                            class="absolute top-2 right-2 bg-black/50 rounded-full w-8 h-8
                                   flex items-center justify-center hover:bg-black/70"
                            title="Show Lyrics" aria-label="Show lyrics">
                        <i class="fas fa-align-left text-sm" aria-hidden="true"></i>
                    </button>
                </div>

                <!-- Controls -->
                <div class="flex-1 flex flex-col controls">
                    <div class="mb-4 overflow-hidden">
                        <h2 id="songTitle" class="text-2xl font-bold mb-1 neon-text truncate max-w-full">
                            Select a song
                        </h2>
                        <p id="artist" class="text-white/70">—</p>
                    </div>

                    <!-- Progress -->
                    <div class="progress-bar mb-2" id="progressBar" role="slider"
                         aria-label="Playback progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div id="progress" class="progress-fill w-0"></div>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <span id="currentTime" class="text-sm text-white/70">0:00</span>
                        <span id="duration"    class="text-sm text-white/70">0:00</span>
                    </div>

                    <!-- Playback buttons -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <button id="shuffleBtn" class="control-btn text-white/50 hover:text-white"
                                    title="Shuffle" aria-label="Toggle shuffle" aria-pressed="false">
                                <i class="fas fa-shuffle text-lg" aria-hidden="true"></i>
                            </button>
                            <button id="prevBtn" class="control-btn p-2"
                                    title="Previous" aria-label="Previous song">
                                <i class="fas fa-backward-step text-xl" aria-hidden="true"></i>
                            </button>
                        </div>

                        <button id="playBtn"
                                class="control-btn bg-white/10 rounded-full w-14 h-14
                                       flex items-center justify-center hover:bg-white/20 pulse"
                                title="Play / Pause" aria-label="Play">
                            <i class="fas fa-play text-2xl" aria-hidden="true"></i>
                        </button>

                        <div class="flex items-center gap-2">
                            <button id="nextBtn" class="control-btn p-2"
                                    title="Next" aria-label="Next song">
                                <i class="fas fa-forward-step text-xl" aria-hidden="true"></i>
                            </button>
                            <button id="repeatBtn" class="control-btn text-white/50 hover:text-white"
                                    title="Repeat" aria-label="Toggle repeat" aria-pressed="false">
                                <i class="fas fa-repeat text-lg" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Volume -->
                    <div class="flex items-center gap-3 mt-4">
                        <i class="fas fa-volume-low text-white/70" aria-hidden="true"></i>
                        <input type="range" id="volumeSlider" class="volume-slider"
                               min="0" max="1" step="0.01" value="0.7"
                               aria-label="Volume">
                        <i class="fas fa-volume-high text-white/70" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Playlist ────────────────────────────────────────────────── -->
        <div class="glass-effect rounded-2xl p-6 neon-shadow">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <h3 class="text-xl font-bold">Library</h3>
                    <span class="text-xs text-white/40 bg-white/10 px-2 py-0.5 rounded-full"
                          title="Songs are saved in your browser's local storage">
                        <i class="fas fa-hard-drive mr-1" aria-hidden="true"></i>local
                    </span>
                </div>
                <div class="flex gap-3">
                    <button id="refreshBtn" class="bg-white/10 px-3 py-1 rounded-lg hover:bg-white/20"
                            title="Reload library from storage" aria-label="Reload library">
                        <i class="fas fa-arrows-rotate" aria-hidden="true"></i>
                    </button>
                    <button id="uploadBtn"
                            class="upload-btn px-4 py-2 rounded-lg text-white font-medium flex items-center"
                            title="Add a song to your local library" aria-label="Add new song">
                        <i class="fas fa-upload mr-2" aria-hidden="true"></i>Upload
                    </button>
                </div>
            </div>

            <div class="playlist-container h-72 overflow-y-auto pr-2">
                <ul id="playlist" class="space-y-2" role="list" aria-label="Song library">
                    <li class="text-center py-10 text-white/50">
                        <i class="fas fa-music text-3xl mb-2" aria-hidden="true"></i>
                        <p>No songs yet. Click <strong>Upload</strong> to add songs from your device.</p>
                    </li>
                </ul>
            </div>

            <div class="mt-4 text-center text-white/50 text-sm">
                Made with <span class="text-red-400" aria-label="love">❤️</span> by DK.
            </div>
        </div>
    </div>

    <!-- ── Floating Action Button (mini player indicator) ─────────────── -->
    <div id="miniPlayer" class="fab hidden" role="button"
         tabindex="0" aria-label="Scroll to player">
        <i class="fas fa-music" aria-hidden="true"></i>
    </div>

    <!-- ── Upload Modal ───────────────────────────────────────────────── -->
    <div id="uploadModal" class="fixed inset-0 hidden items-center justify-center z-50 modal-overlay"
         role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
        <div class="glass-effect rounded-2xl p-6 w-full max-w-md neon-shadow mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 id="uploadModalTitle" class="text-xl font-bold">Add Song to Library</h3>
                <button id="cancelBtn" class="text-white/50 hover:text-white" aria-label="Close dialog">
                    <i class="fas fa-xmark text-xl" aria-hidden="true"></i>
                </button>
            </div>

            <form id="uploadForm" class="space-y-4" novalidate>
                <div>
                    <label for="titleInput" class="block mb-2 text-sm font-medium">Song Title</label>
                    <input type="text" id="titleInput" required
                           class="w-full bg-white/10 rounded-lg p-3 focus:outline-none
                                  focus:ring-2 focus:ring-white/50 placeholder-white/30"
                           placeholder="Enter song title">
                </div>
                <div>
                    <label for="artistInput" class="block mb-2 text-sm font-medium">Artist</label>
                    <input type="text" id="artistInput"
                           class="w-full bg-white/10 rounded-lg p-3 focus:outline-none
                                  focus:ring-2 focus:ring-white/50 placeholder-white/30"
                           placeholder="Enter artist name">
                </div>
                <div>
                    <label for="lyricsInput" class="block mb-2 text-sm font-medium">
                        Lyrics <span class="text-white/50">(optional)</span>
                    </label>
                    <textarea id="lyricsInput" rows="3"
                              class="w-full bg-white/10 rounded-lg p-3 focus:outline-none
                                     focus:ring-2 focus:ring-white/50 placeholder-white/30"
                              placeholder="Enter song lyrics"></textarea>
                </div>
                <div>
                    <label class="block mb-2 text-sm font-medium">
                        Cover Art <span class="text-white/50">(optional)</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <label for="coverInput"
                               class="cursor-pointer bg-white/10 rounded-lg p-3 flex-1
                                      text-center hover:bg-white/20">
                            <i class="fas fa-image mr-2" aria-hidden="true"></i>
                            <span id="coverFileName">Choose cover image</span>
                            <input type="file" id="coverInput"
                                   accept="image/jpeg,image/png,image/gif,image/webp"
                                   class="hidden">
                        </label>
                        <div id="coverPreview"
                             class="w-16 h-16 bg-white/5 rounded-lg overflow-hidden hidden"
                             aria-hidden="true">
                            <img id="coverPreviewImg" class="w-full h-full object-cover" alt="">
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block mb-2 text-sm font-medium">Song File (MP3)</label>
                    <label for="songInput"
                           class="cursor-pointer bg-white/10 rounded-lg p-3 flex
                                  text-center hover:bg-white/20">
                        <i class="fas fa-music mr-2" aria-hidden="true"></i>
                        <span id="songFileName">Choose MP3 file</span>
                        <input type="file" id="songInput"
                               accept="audio/mpeg,.mp3" required class="hidden">
                    </label>
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="submit"
                            class="flex-1 bg-white/10 px-4 py-3 rounded-lg hover:bg-white/20
                                   font-medium flex items-center justify-center">
                        <i class="fas fa-floppy-disk mr-2" aria-hidden="true"></i>Save to Library
                    </button>
                    <button type="button" id="cancelUploadBtn"
                            class="flex-1 bg-red-500/20 px-4 py-3 rounded-lg
                                   hover:bg-red-500/30 font-medium">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Lyrics Modal ───────────────────────────────────────────────── -->
    <div id="lyricsModal" class="fixed inset-0 hidden items-center justify-center z-50 modal-overlay"
         role="dialog" aria-modal="true" aria-labelledby="lyricsModalTitle">
        <div class="glass-effect rounded-2xl p-6 w-full max-w-md neon-shadow mx-4
                    max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="lyricsModalTitle" class="text-xl font-bold">Lyrics</h3>
                <button id="closeLyricsBtn" class="text-white/50 hover:text-white"
                        aria-label="Close lyrics dialog">
                    <i class="fas fa-xmark text-xl" aria-hidden="true"></i>
                </button>
            </div>
            <div class="lyrics-container flex-1 overflow-y-auto py-2">
                <p id="lyricsText" class="text-white/80">No lyrics available for this song.</p>
            </div>
        </div>
    </div>

    <!-- ── Notification Toast ─────────────────────────────────────────── -->
    <div id="toast" class="fixed bottom-4 right-4 hidden" role="status" aria-live="polite"></div>

    <!-- Application logic -->
    <script src="./player.js"></script>
</body>
</html>
